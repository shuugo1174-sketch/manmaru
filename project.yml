# XcodeGen で .xcodeproj を作るよ。
# .xcodeproj は手書きしない。`xcodegen` を打つと作られる。
name: Manmaru
options:
  bundleIdPrefix: com.shugo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
targets:
  Manmaru:
    type: application
    platform: iOS
    bundleId: com.shugo.manmaruapp
    deploymentTarget: "17.0"
    sources:
      - Manmaru/App
      # 画像（XcodeGen に resources: というキーはない。sources に入れると自動で画像として入る）
      - path: Manmaru/Assets.xcassets
    # 注意：XcodeGen は info.path の plist をビルドのたびに作り直す（上書きする）。
    # だから必要なキーは plist ではなく、ここの properties に書く。
    info:
      path: Manmaru/Info.plist
      properties:
        CFBundleDevelopmentRegion: ja
        CFBundleDisplayName: "まんまる"
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "歩数と睡眠を読んで、まんまるの声かけとウィジェットに使うよ。"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # entitlements も XcodeGen が作り直すので、中身は properties に書く。
    entitlements:
      path: Manmaru/Manmaru.entitlements
      properties:
        com.apple.security.application-groups:
          - group.manmaru
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        SWIFT_VERSION: "5.0"
        # 中身の名前は英語（Manmaru.app）。ホーム画面の名前は CFBundleDisplayName の「まんまる」。
        PRODUCT_NAME: "Manmaru"
        # bundleId: だけだと XcodeGen が com.shugo.Manmaru にしてしまうので、ここでも決める
        PRODUCT_BUNDLE_IDENTIFIER: com.shugo.manmaruapp
        # iPhoneの中のAI（iOS 26から）。古いiOSでも起動できるように weak にする
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: ManmaruWidget
  ManmaruWidget:
    type: app-extension
    platform: iOS
    bundleId: com.shugo.manmaruapp.widget
    deploymentTarget: "17.0"
    sources:
      # ウィジェット本体
      - ManmaruWidget
      # 共有：モデルとURL解決（アプリと同じファイルを使う）
      - path: Manmaru/App/TrackerFeed.swift
      # 共有：ライブアクティビティの型（アプリと同じファイルを使う）
      - path: Manmaru/App/LiveActivityManager.swift
      # 画像（アプリと同じものを使う）
      - path: Manmaru/Assets.xcassets
    # ここの NSExtension がないと、iOS がウィジェットとして認めない（Sideloadly の
    # 「extensionDictionary must be set」エラーになる）。plist ではなく properties に書く。
    info:
      path: ManmaruWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: ja
        CFBundleDisplayName: "まんまる"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ManmaruWidget/ManmaruWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.manmaru
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: "ManmaruWidget"
        PRODUCT_BUNDLE_IDENTIFIER: com.shugo.manmaruapp.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
