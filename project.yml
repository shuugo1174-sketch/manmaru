# XcodeGen で .xcodeproj を作るよ。
# .xcodeproj は手書きしない。`xcodegen` を打つと作られる。
name: Manmaru
options:
  bundleIdPrefix: com.shugo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
targets:
  Manmaru:
    type: application
    platform: iOS
    bundleId: com.shugo.manmaru
    deploymentTarget: "17.0"
    sources:
      - Manmaru/App
    resources:
      - Manmaru/Assets.xcassets
    info:
      path: Manmaru/Info.plist
    entitlements:
      path: Manmaru/Manmaru.entitlements
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: "まんまる"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: ManmaruWidget
  ManmaruWidget:
    type: app-extension
    platform: iOS
    bundleId: com.shugo.manmaru.widget
    deploymentTarget: "17.0"
    sources:
      # ウィジェット本体
      - ManmaruWidget
      # 共有：モデルとURL解決（アプリと同じファイルを使う）
      - path: Manmaru/App/TrackerFeed.swift
      # 共有：ライブアクティビティの型（アプリと同じファイルを使う）
      - path: Manmaru/App/LiveActivityManager.swift
    resources:
      - Manmaru/Assets.xcassets
    info:
      path: ManmaruWidget/Info.plist
    entitlements:
      path: ManmaruWidget/ManmaruWidget.entitlements
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: "ManmaruWidget"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
