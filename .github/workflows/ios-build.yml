name: iOS Build
on:
  workflow_dispatch:  # 手動で実行する

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Manmaru.xcodeproj \
            -scheme Manmaru \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r Manmaru-unsigned.ipa Payload
      - name: Check widget is inside (NSExtension)
        run: |
          set -e
          rm -rf check && mkdir check && cd check
          unzip -q ../Manmaru-unsigned.ipa
          APPPL=Payload/Manmaru.app/Info.plist
          WPL=Payload/Manmaru.app/PlugIns/ManmaruWidget.appex/Info.plist
          test -f "$WPL" || { echo "ERROR: ManmaruWidget.appex がない"; exit 1; }
          echo "app id:    $(plutil -extract CFBundleIdentifier raw "$APPPL")"
          echo "widget id: $(plutil -extract CFBundleIdentifier raw "$WPL")"
          EP=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$WPL")
          echo "NSExtensionPointIdentifier: $EP"
          test "$EP" = "com.apple.widgetkit-extension" || { echo "ERROR: NSExtension がない"; exit 1; }
          test "$(plutil -extract CFBundleIdentifier raw "$APPPL")" = "com.shugo.manmaru"
          test "$(plutil -extract CFBundleIdentifier raw "$WPL")" = "com.shugo.manmaru.widget"
          echo "OK: ウィジェット入り"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Manmaru-unsigned-v3
          path: Manmaru-unsigned.ipa
