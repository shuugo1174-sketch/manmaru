name: iOS Build
on:
  workflow_dispatch:  # 手動で実行する

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Resize app icon to 1024x1024
        # 元の AppIcon.png は 1600x1600。iOS は 1024x1024 を欲しがるので、ビルドの前に縮める。
        run: sips -z 1024 1024 Manmaru/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project Manmaru.xcodeproj \
            -scheme Manmaru \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          # 署名はしないが、entitlements（App Group・HealthKit）を中に入れるため ad-hoc で印をつける。
          # Sideloadly が自分の Apple ID で署名し直すときに、この entitlements を使う。
          codesign -f -s - --entitlements ManmaruWidget/ManmaruWidget.entitlements Payload/Manmaru.app/PlugIns/ManmaruWidget.appex
          codesign -f -s - --entitlements Manmaru/Manmaru.entitlements Payload/Manmaru.app
          codesign -d --entitlements - Payload/Manmaru.app
          zip -r Manmaru-unsigned.ipa Payload
      - name: Check widget is inside (NSExtension)
        run: |
          set -e
          rm -rf check && mkdir check && cd check
          unzip -q ../Manmaru-unsigned.ipa
          APPPL=Payload/Manmaru.app/Info.plist
          WPL=Payload/Manmaru.app/PlugIns/ManmaruWidget.appex/Info.plist
          test -f "$WPL" || { echo "ERROR: ManmaruWidget.appex がない"; exit 1; }
          echo "app id:    $(plutil -extract CFBundleIdentifier raw "$APPPL")"
          echo "widget id: $(plutil -extract CFBundleIdentifier raw "$WPL")"
          EP=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$WPL")
          echo "NSExtensionPointIdentifier: $EP"
          test "$EP" = "com.apple.widgetkit-extension" || { echo "ERROR: NSExtension がない"; exit 1; }
          test "$(plutil -extract CFBundleIdentifier raw "$APPPL")" = "com.shugo.manmaruapp"
          test "$(plutil -extract CFBundleIdentifier raw "$WPL")" = "com.shugo.manmaruapp.widget"
          echo "OK: ウィジェット入り"
          test -f Payload/Manmaru.app/Assets.car || { echo "ERROR: アプリに画像（Assets.car）がない"; exit 1; }
          test -f Payload/Manmaru.app/PlugIns/ManmaruWidget.appex/Assets.car || { echo "ERROR: ウィジェットに画像（Assets.car）がない"; exit 1; }
          echo "OK: 画像入り"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Manmaru-unsigned-v6
          path: Manmaru-unsigned.ipa
